name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    container: archlinux:base@sha256:d4594bb2300cba11f41c2f27923eb56f63d9988909c402f9c95517d1e362c899
    steps:
      - name: Install build and desktop dependencies
        run: |
          printf '%s\n' 'Server = https://archive.archlinux.org/repos/2026/11/11/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm --needed git cmake ninja gcc pkgconf qt6-base qt6-declarative qt6-svg qt6-virtualkeyboard qt6-wayland layer-shell-qt libei speech-dispatcher kirigami qqc2-desktop-style dbus
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGAZE_GRID_WITH_TOBII=OFF
      - run: cmake --build build --parallel 2
      - run: dbus-run-session -- ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14.0'
      - name: Install Qt with locked installer dependencies
        shell: pwsh
        run: ./platform/windows/Install-Qt.ps1
      - name: Configure WiX 3 and test certificate
        shell: pwsh
        run: |
          (Join-Path $env:WIX 'bin') | Out-File -FilePath $env:GITHUB_PATH -Append
          $password = ConvertTo-SecureString ([guid]::NewGuid().ToString()) -AsPlainText -Force
          ./platform/windows/New-gaze-gridCertificate.ps1 -OutputDirectory "$env:RUNNER_TEMP/signing" -Password $password
          $cert = Get-PfxCertificate "$env:RUNNER_TEMP/signing/gaze-grid.cer"
          Import-Certificate -FilePath "$env:RUNNER_TEMP/signing/gaze-grid.cer" -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          "SIGNING_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build, test, sign and package (ephemeral CI identity)
        shell: pwsh
        run: ./platform/windows/Build-Release.ps1 -CertificateThumbprint $env:SIGNING_THUMBPRINT
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
      - name: Verify MSI installation, signed application launch and uninstall
        shell: pwsh
        run: |
          $msi = (Get-ChildItem build/windows/*.msi | Select-Object -First 1).FullName
          ./platform/windows/Test-Installed.ps1 -Msi $msi -CertificateThumbprint $env:SIGNING_THUMBPRINT
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gaze-grid-Windows-x64-test-MSI
          path: |
            build/windows/*.msi
            build/windows/gaze-grid.cer
          if-no-files-found: error
      - name: Upload Windows diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installer-diagnostics
          path: |
            build/windows/*-qt-test.txt
            build/windows/Testing/Temporary/LastTest.log
            build/windows/_CPack_Packages/win64/WIX/wix.log
            ${{ runner.temp }}/gaze-grid-msi-*.log
            ${{ runner.temp }}/gaze-grid-app-*
          if-no-files-found: ignore
